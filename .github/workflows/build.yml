# Compila o programa e o instalador a partir do código deste repositório.
# Em todo push: o instalador fica como artefato do run.
# Em tag v*: o instalador vai para uma Release do GitHub.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          choco install innosetup --no-progress -y

      - name: Build
        shell: cmd
        run: build.cmd

      - uses: actions/upload-artifact@v4
        id: instalador
        with:
          name: Galeria-Setup
          path: dist/Galeria-Setup-*.exe
          if-no-files-found: error

      # Depois da aprovação do SignPath Foundation, entra aqui o passo de assinatura
      # (signpath/github-action-submit-signing-request), antes da Release.

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Galeria-Setup-*.exe
